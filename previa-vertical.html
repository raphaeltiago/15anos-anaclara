<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia vertical — Ana Clara</title><style>
*{box-sizing:border-box}body{margin:0;background:#090f24;color:#f9e6b4;font-family:Georgia,serif;display:flex;justify-content:center;min-height:100dvh}.phone{width:min(100vw,430px);height:100dvh;min-height:580px;position:relative;overflow:hidden;background:linear-gradient(#0c1735,#172a4d 50%,#0a1630);isolation:isolate}
.sky{position:absolute;inset:0;overflow:hidden}.sky:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 10%,rgba(5,12,30,.4) 100%);z-index:2}
.lantern{position:absolute;left:var(--x);top:var(--y);width:var(--w);height:calc(var(--w)*1.55);border-radius:44% 44% 30% 30%;background:linear-gradient(90deg,#c97627,#ffdc80 35%,#fff0b6 55%,#d98b36);box-shadow:0 0 15px 5px #e7a14c88,0 0 40px 13px #e7a14c33;opacity:var(--o);animation:rise var(--d) linear infinite;animation-delay:var(--delay)}
.lantern:after{content:"";position:absolute;bottom:-2px;left:30%;width:40%;height:3px;background:#ffed9d}
@keyframes rise{from{transform:translateY(22vh) scale(.85)}to{transform:translateY(-120vh) scale(1.08)}}
.movie{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100%;height:auto;max-height:55%;object-fit:contain;z-index:4;box-shadow:0 0 28px 15px #0d1d3a80}
.fade-top,.fade-bottom{position:absolute;left:0;right:0;height:13%;z-index:5;pointer-events:none}.fade-top{top:20%;background:linear-gradient(transparent,#0e1d3b00)}.fade-bottom{bottom:20%;background:linear-gradient(#0e1d3b00,transparent)}

</style></head><body><main class="phone"><div class="sky" id="sky"></div><div class="label">ANA CLARA · PRÉVIA VERTICAL</div><video class="movie" src="./ana-clara-video-final.mp4" autoplay muted playsinline loop controls></video><div class="foot">Simulação 9:16: vídeo original inteiro com céu noturno e lanternas ao redor. O convite publicado não foi alterado.</div><a class="back" href="./">← Convite original</a></main><script>
